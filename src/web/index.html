<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Atlas</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <h1>
      <svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.55"/>
        <path d="M16 5 L19.5 16 L16 27 L12.5 16 Z" fill="currentColor"/>
        <circle cx="16" cy="16" r="2.4" fill="var(--logo-dot)"/>
      </svg>
      Skill Atlas
    </h1>
    <form id="scan" role="search">
      <input id="repo" name="repo" type="text" required autofocus spellcheck="false" autocomplete="off"
        placeholder="https://github.com/owner/repo, https://github.com/owner, or a directory" aria-label="Repository or organization to search">
      <button type="submit">Scan</button>
    </form>
  </header>
  <main id="results">
    <nav id="skills" aria-label="Skills">
      <input id="filter" type="search" spellcheck="false" autocomplete="off"
        placeholder="Filter by name" aria-label="Filter skills by name" aria-controls="list">
      <div id="found">
        <p id="status" role="status" hidden></p>
        <div id="scanned" hidden>
          <div id="owner" hidden>
            <img alt="" width="40" height="40">
            <div>
              <a class="login" target="_blank" rel="noopener noreferrer"></a>
              <a class="homepage" target="_blank" rel="noopener noreferrer"></a>
            </div>
          </div>
          <h2 id="summary"></h2>
          <p id="no-match" class="placeholder" role="status" hidden></p>
          <div id="list"></div>
          <details id="warnings" hidden>
            <summary></summary>
            <ul></ul>
          </details>
        </div>
      </div>
    </nav>
    <article id="skill" aria-live="polite">
      <p class="placeholder">Scan a GitHub repository, a GitHub organization or a directory.</p>
    </article>
  </main>
</body>
</html>
