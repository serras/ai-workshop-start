# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          # The end-to-end tests scan real repositories; without a token they are skipped.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
      # The web view, on its default port: the page, and the fixture scanned through it.
      - name: Smoke test, web view
        run: |
          ./skill-atlas serve &
          for i in $(seq 20); do curl -fsS http://localhost:3000/ > /dev/null && break; sleep 0.5; done
          curl -fsS 'http://localhost:3000/api/scan?repo=./fixture' | grep -q '"name":"commits"'
          kill %1
